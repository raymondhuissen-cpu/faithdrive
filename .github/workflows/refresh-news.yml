name: Nieuws vernieuwen

on:
  schedule:
    - cron: "0 6 * * *"   # Elke dag om 06:00 UTC (08:00 NL zomertijd)
    - cron: "0 12 * * *"  # En om 12:00 UTC (14:00 NL)
  workflow_dispatch:       # Handmatig starten mogelijk

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zorg-nieuws

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zorg-nieuws/package-lock.json

      - run: npm ci

      - name: Feeds ophalen en opslaan
        run: node scripts/fetch-news.mjs

      - name: Commit nieuws cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news-cache.json
          git diff --cached --quiet || git commit -m "chore: nieuws cache bijgewerkt [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git push
