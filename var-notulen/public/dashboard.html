<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAR Notulen — Overzicht</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <a href="dashboard.html" class="brand">
      <span class="brand-badge">🎙</span>
      <span>VAR Notulen<small>Bravis ziekenhuis</small></span>
    </a>
    <button class="btn btn-secondary btn-sm" onclick="logout()">Uitloggen</button>
  </header>

  <main>
    <div class="list-header">
      <div>
        <div class="page-title">Vergaderingen</div>
        <div class="muted">Opgenomen en getranscribeerde VAR-vergaderingen</div>
      </div>
      <button class="btn btn-primary" id="newMeetingBtn">+ Nieuwe opname</button>
    </div>

    <div class="search-row" id="searchRow" style="display:none;">
      <div class="search-input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Zoeken op titel…">
      </div>
    </div>

    <div id="list"></div>
  </main>
</div>

<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
  const list = document.getElementById('list');
  const searchRow = document.getElementById('searchRow');
  const searchInput = document.getElementById('searchInput');
  let allMeetings = [];

  function formatDate(iso) {
    return new Date(iso).toLocaleString('nl-NL', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderList(meetings) {
    if (allMeetings.length === 0) {
      list.innerHTML = '<div class="card empty-state">Nog geen vergaderingen opgenomen.<br>Klik op “+ Nieuwe opname” om te beginnen.</div>';
      return;
    }
    if (meetings.length === 0) {
      list.innerHTML = '<div class="card empty-state">Geen vergaderingen gevonden voor deze zoekopdracht.</div>';
      return;
    }
    list.innerHTML = `<div class="meeting-list">${meetings.map((m) => `
      <a class="meeting-item" href="meeting.html?id=${encodeURIComponent(m.id)}">
        <div>
          <div class="meeting-item-title">${escapeHtml(m.title)}</div>
          <div class="meeting-item-meta">${formatDate(m.createdAt)} · ${m.segmentCount} fragment${m.segmentCount === 1 ? '' : 'en'}</div>
        </div>
        <span class="status-pill ${m.status === 'recording' ? 'status-recording' : 'status-done'}">
          ${m.status === 'recording' ? 'Loopt nog' : 'Afgerond'}
        </span>
      </a>
    `).join('')}</div>`;
  }

  function applySearch() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q ? allMeetings.filter((m) => m.title.toLowerCase().includes(q)) : allMeetings;
    renderList(filtered);
  }

  async function loadMeetings() {
    list.innerHTML = '<div class="loading-row"><div class="spinner"></div></div>';
    const res = await fetch('/api/meetings');
    if (res.status === 401) return window.location.replace('login.html');
    allMeetings = await res.json();
    searchRow.style.display = allMeetings.length > 3 ? 'block' : 'none';
    applySearch();
  }

  searchInput.addEventListener('input', applySearch);

  document.getElementById('newMeetingBtn').addEventListener('click', async () => {
    const defaultTitle = 'VAR overleg ' + new Date().toLocaleDateString('nl-NL');
    const title = await showPromptDialog({
      title: 'Nieuwe vergadering',
      label: 'Titel van deze vergadering',
      defaultValue: defaultTitle,
      confirmLabel: 'Start opname →',
    });
    if (title === null) return;

    const btn = document.getElementById('newMeetingBtn');
    btn.disabled = true;
    try {
      const res = await fetch('/api/meetings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      if (!res.ok) throw new Error('Serverfout');
      const meeting = await res.json();
      window.location.href = `recorder.html?id=${encodeURIComponent(meeting.id)}`;
    } catch {
      showToast('Kon geen nieuwe vergadering aanmaken. Probeer het opnieuw.', 'error');
      btn.disabled = false;
    }
  });

  (async () => {
    if (await requireSession()) loadMeetings();
  })();
</script>
</body>
</html>
